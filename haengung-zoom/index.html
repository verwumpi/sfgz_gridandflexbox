<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hängung</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="kopf">
    <h1>Hängung</h1>
    <p>Raster 4 × 3, statisch. Hover vergrössert das Bild.</p>
  </header>

  <main>
    <!--
      12 Bilder = 4 Spalten × 3 Zeilen.
      Reihenfolge im HTML = Reihenfolge an der Wand:
      Zeile 1: Bild 1–4, Zeile 2: Bild 5–8, Zeile 3: Bild 9–12.

      Eigene Bilder: in images/ legen, src und alt anpassen.
    -->
    <div class="wand">
      <figure class="bild"><img src="images/B_Synth.jpeg" alt="Bild 1"></figure>
      <figure class="bild"><img src="images/ABY.jpeg" alt="Bild 2"></figure>
      <figure class="bild"><img src="images/Big_Muff.jpeg" alt="Bild 3"></figure>
      <figure class="bild"><img src="images/Distort.jpeg" alt="Bild 4"></figure>

      <figure class="bild"><img src="images/Epitom.jpeg" alt="Bild 5"></figure>
      <figure class="bild"><img src="images/EQ.jpeg" alt="Bild 6"></figure>
      <figure class="bild"><img src="images/Flanger.jpeg" alt="Bild 7"></figure>
      <figure class="bild"><img src="images/Freeze.jpeg" alt="Bild 8"></figure>

      <figure class="bild"><img src="images/Looper.jpeg" alt="Bild 9"></figure>
      <figure class="bild"><img src="images/Mono_Synth.jpeg" alt="Bild 10"></figure>
      <figure class="bild"><img src="images/OD.jpeg" alt="Bild 11"></figure>
      <figure class="bild"><img src="images/Trem.jpeg" alt="Bild 12"></figure>
    </div>
  </main>

</body>

</html>
